<title>دورات حياة النباتات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: a single landscape book page on a school desk — book text on the right (spine side), a play panel on the left; pages flip right-to-left like an Arabic textbook. Single deliberate "paper" look. */
:root{
  color-scheme: light;
  --desk:#17394A; --desk-2:#235A70;
  --paper:#FFFDF8; --paper-edge:#E6DFCF; --ink:#26221D; --ink-soft:#5E574D;
  --blue:#1D6FB8; --green:#3A9A3A; --red:#D7362B; --muscle:#C9332E; --muscle-2:#EC6A5A;
  --mark:#FFE45A; --purple:#8A3F9E; --magenta:#D2357F; --gold:#F2AE16;
  --play:#F2F7FB; --play-line:#CFE0EE; --ok:#2C9A57; --ok-bg:#E3F5EA; --bad:#D64040; --bad-bg:#FCE8E6;
  --skin:#F5D5BC; --skin-line:#D49D79; --bone:#F4EBD6; --bone-line:#C9B48C; --tendon:#F1E6C8;
  --f-book:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI","Tahoma",sans-serif;
  --fs:clamp(14px, calc(0.9vw + 2.2vh), 21px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{direction:rtl;height:100%}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-ui);
  background:radial-gradient(ellipse at 50% 40%, var(--desk-2), var(--desk) 70%);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--f-ui);cursor:pointer}
button:focus-visible,input:focus-visible,.chip:focus-visible,.zone:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding-block:6px}
#book{position:relative;width:100%;height:100%;max-width:1220px;max-height:700px;perspective:2200px}

/* ---------- page ---------- */
.page{position:absolute;inset:0;background:var(--paper);border-radius:16px 5px 5px 16px;
  box-shadow:-3px 1px 0 var(--paper-edge),-6px 2px 0 #D6CDB9,-9px 3px 0 #C9BFA9,0 14px 34px rgba(0,0,0,.4);
  transform-origin:right center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.page::after{content:"";position:absolute;inset:0 0 0 auto;width:34px;pointer-events:none;
  background:linear-gradient(to left, rgba(60,40,10,.20), rgba(60,40,10,.06) 40%, transparent)}
.page .shade{position:absolute;inset:0;background:linear-gradient(to left, rgba(0,0,0,.05), rgba(0,0,0,.35));opacity:0;pointer-events:none;z-index:5}
.sheet{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr);gap:clamp(10px,1.8vw,24px);
  padding:clamp(10px,2.4vh,24px) clamp(30px,3.4vw,46px) clamp(44px,8vh,58px) clamp(16px,2.4vw,30px)}

/* ---------- text column (book) ---------- */
.txt{min-height:0;min-width:0;display:flex;flex-direction:column;gap:4px}
.txt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
.booktag{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;display:flex;align-items:center;gap:5px}
.booktag i{width:9px;height:9px;border-radius:2px;background:var(--blue);display:inline-block}
.readbtn{white-space:nowrap;flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:14px;
  padding:4px 12px 4px 14px;border-radius:999px;box-shadow:0 2px 0 #12528C}
.readbtn svg{width:18px;height:18px}
.readbtn.on{background:var(--red);box-shadow:0 2px 0 #9B2219}
.txt-body{flex:1 1 auto;min-height:0;overflow:auto;font-family:var(--f-book);font-size:var(--fs);line-height:1.85;padding-inline-end:6px;
  scrollbar-width:thin;user-select:text;-webkit-user-select:text}
.txt-body p{margin:0 0 .45em}
.bh{font-family:var(--f-book);font-weight:700;color:var(--blue);font-size:1.18em;margin:0 0 .25em;line-height:1.5;text-wrap:balance}
.lead{font-weight:700}
.cap{color:var(--purple);font-size:.86em;line-height:1.7;display:flex;gap:6px;align-items:flex-start}
.cap .tri{flex:0 0 auto;width:0;height:0;margin-top:.55em;border-block:6px solid transparent;border-inline-start:9px solid #1EA3E0}
.li{position:relative;padding-inline-start:1.1em}
.li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;border-block:6px solid transparent;border-inline-start:10px solid var(--red)}
.num{display:flex;gap:.45em;align-items:flex-start}
.nb{flex:0 0 auto;width:1.35em;height:1.35em;margin-top:.25em;border-radius:50%;background:var(--blue);color:#fff;font-size:.78em;display:grid;place-items:center;font-family:var(--f-ui);font-weight:700}
.w{border-radius:4px;transition:background .15s,color .15s}
.w.on{background:#BFE1FF;color:#0B3E6E;box-shadow:0 0 0 2px #BFE1FF}
.mk{background:var(--mark);border-radius:3px;padding:0 2px}
.rd{color:var(--red)}
.bl{color:var(--blue)}
.reading{background:linear-gradient(to left, rgba(29,111,184,.07), transparent);border-radius:8px}
.tab{display:inline-block;font-family:var(--f-ui);font-weight:800;color:#fff;padding:2px 16px;border-radius:14px 14px 4px 4px;font-size:.95em;margin-bottom:.3em}
.tab.g{background:var(--green)}
.tab.b{background:linear-gradient(to left,#2A8FE0,#1D6FB8)}
.tab.n{background:linear-gradient(to left,#2A8FE0,#1D6FB8)}
.idea{border:2px solid var(--green);border-radius:14px;padding:.4em .7em;background:#FFFEF3}
.sub{font-weight:700;margin:.2em 0 .1em}
.vocab{display:grid;grid-template-columns:auto auto;gap:.1em 1em;font-size:.95em}
.vocab .en{color:var(--red);font-weight:700;direction:ltr;text-align:left;font-family:Georgia,serif;font-size:.9em}
.think{border:2px solid #8DB9E3;border-radius:14px;padding:.45em .75em}
.bookfig{float:left;width:34%;margin:.1em 0 .2em .6em;border-radius:6px;mix-blend-mode:multiply}

/* ---------- play column ---------- */
.stage{min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px;background:var(--play);border:2px solid var(--play-line);border-radius:18px;padding:8px;
  background-image:radial-gradient(#DCE8F2 1px, transparent 1.2px);background-size:16px 16px}
.coach{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.coach .mascot{width:46px;height:46px;flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:2px solid #E7D7C4;border-radius:14px;padding:4px 10px;font-size:clamp(13px,calc(.7vw + 1.7vh),17px);line-height:1.5;font-weight:500;min-height:42px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;inset-inline-start:-9px;top:50%;margin-top:-7px;border-block:7px solid transparent;border-inline-end:9px solid #E7D7C4}
.bubble.pop{animation:pop .35s ease}
.say{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:0;background:#FFE8D6;color:var(--muscle);display:grid;place-items:center}
.say svg{width:18px;height:18px}
.play{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.hint{margin:0;color:var(--ink-soft);font-size:13px;text-align:center}
.btn{border:0;border-radius:999px;padding:6px 18px;font-weight:800;font-size:15px;color:#fff;background:var(--muscle);box-shadow:0 3px 0 #8E1F1B;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8E1F1B}
.btn.alt{background:var(--blue);box-shadow:0 3px 0 #12528C}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 0 0 2px var(--play-line)}

/* ---------- nav ---------- */
#nav{position:absolute;inset:auto 0 0 0;height:clamp(40px,7.5vh,50px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(10px,1.6vw,20px) 4px clamp(12px,2vw,24px);z-index:20;pointer-events:none}
#nav > *{pointer-events:auto}
.navbtn{width:clamp(34px,6vh,42px);height:clamp(34px,6vh,42px);border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #12528C}
.navbtn svg{width:58%;height:58%}
.navbtn:disabled{background:#C9D3DC;box-shadow:none;cursor:default}
#next.nudge{animation:nudge 1.2s ease-in-out infinite}
.mid{display:flex;align-items:center;gap:clamp(8px,1.6vw,18px)}
#dots{display:flex;gap:5px;align-items:center}
#dots i{width:7px;height:7px;border-radius:50%;background:#D8D1C2}
#dots i.done{background:#9CC7EC}
#dots i.cur{background:var(--blue);width:18px;border-radius:5px}
.pgnum{width:34px;height:34px;border-radius:50%;border:2px solid var(--magenta);color:var(--magenta);display:grid;place-items:center;font-weight:700;font-size:15px;background:#fff}
#stars{display:flex;align-items:center;gap:4px;font-weight:800;color:#7A5300;background:#FFF4D6;border-radius:999px;padding:2px 10px 2px 8px;font-size:15px}
#stars svg{width:18px;height:18px}
#stars.pop{animation:pop .45s ease}
.tools{display:flex;gap:6px}
.tool{width:32px;height:32px;border-radius:50%;border:0;background:#EEF3F8;color:var(--ink-soft);display:grid;place-items:center}
.tool svg{width:17px;height:17px}

/* ---------- reusable game bits ---------- */
.chip{touch-action:none;cursor:grab;background:#fff;border:2px solid #D9E3EC;border-radius:14px;padding:5px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 #D2DCE5;position:relative;z-index:1;transition:transform .2s, box-shadow .2s}
.chip.sel{border-color:var(--gold);box-shadow:0 0 0 3px #FFE7A6}
.chip.dragging{z-index:50;transition:none;cursor:grabbing;box-shadow:0 10px 22px rgba(0,0,0,.25)}
.chip.placed{cursor:default;box-shadow:none;border-color:var(--ok);background:var(--ok-bg)}
.zone{border:2px dashed #A9C3DA;border-radius:16px;background:rgba(255,255,255,.75);transition:background .2s,border-color .2s}
.zone.hot{border-color:var(--gold);background:#FFF8E1}
.shake{animation:shake .4s}

.mcq{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px}
.qq{margin:0;font-weight:700;font-size:clamp(14px,calc(.7vw + 1.8vh),18px);line-height:1.5}
.qlabel{color:var(--red)}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{text-align:right;border:2px solid #D9E3EC;background:#fff;border-radius:12px;padding:5px 10px;font-size:clamp(13px,calc(.6vw + 1.6vh),16px);font-weight:600;color:var(--ink);line-height:1.45;display:flex;gap:8px;align-items:center}
.opt b{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center;font-size:13px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:5px 10px;font-size:clamp(13px,calc(.6vw + 1.6vh),15px);line-height:1.5}
.fb.ok{background:var(--ok-bg);color:#1D6B3C}
.fb.no{background:var(--bad-bg);color:#93231F}
.qnav{display:flex;gap:6px;justify-content:center}
.qnav span{font-size:12px;font-weight:700;color:var(--ink-soft);background:#E8EEF4;border-radius:999px;padding:1px 10px}
.qnav span.cur{background:var(--blue);color:#fff}

/* merge */
.mrow{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.2vw,12px);flex-wrap:wrap}
.card{flex-direction:column;width:clamp(84px,13vw,120px);padding:8px 6px;text-align:center;font-size:clamp(12px,1.4vw,15px)}
.card svg{width:44px;height:44px}
.op{font-size:28px;font-weight:800;color:var(--blue)}
.slot{width:clamp(110px,17vw,160px);min-height:clamp(96px,22vh,130px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.slot .q{font-size:30px;color:#A9C3DA;font-weight:800}
.slot .card{width:100%;flex-direction:row;padding:3px 6px}
.slot .card svg{width:22px;height:22px}
.merged{display:flex;align-items:center;gap:clamp(16px,4vw,40px);height:100%;width:100%;justify-content:center}
.runwrap{position:relative;height:100%;max-height:260px;aspect-ratio:546/704}
.runwrap img{height:100%;width:100%;object-fit:contain;mix-blend-mode:multiply;animation:run .42s ease-in-out infinite alternate}
.speed{position:absolute;left:-14%;top:30%;width:30%;display:flex;flex-direction:column;gap:12px}
.speed i{height:3px;border-radius:2px;background:#9CC7EC;animation:speed .6s linear infinite}
.speed i:nth-child(2){animation-delay:.2s;width:70%}
.speed i:nth-child(3){animation-delay:.4s;width:85%}
.badge{font-weight:800;font-size:clamp(18px,2.6vw,28px);color:#fff;background:var(--muscle);border-radius:16px;padding:6px 16px;box-shadow:0 4px 0 #8E1F1B;text-align:center}
.badge small{display:block;font-size:.5em;font-weight:600;opacity:.95}

/* skeleton */
.skel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;height:100%}
.figure{position:relative;height:100%;max-height:270px;aspect-ratio:1/1;justify-self:center}
.figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:opacity .4s, transform .4s}
.figure img.gone{opacity:0;transform:scale(.94)}
.figure svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .3s}
.figure svg.show{opacity:1}
.bone{transform-box:fill-box;transform-origin:center;transition:transform .8s cubic-bezier(.55,0,.7,1.25);transition-delay:var(--d,0ms)}
.fallen .bone{transform:translate(var(--tx),var(--ty)) rotate(var(--r))}
.count{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;max-width:150px}
.count b{font-size:clamp(34px,6vw,56px);color:var(--muscle);line-height:1.1}
.count span{font-size:13px;color:var(--ink-soft);font-weight:600}
.count .btn{margin-top:10px}

/* arm */
.armwrap{width:100%;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.armsvg{width:100%;height:100%;max-height:340px;touch-action:none;cursor:grab}
.armctl{display:flex;align-items:center;gap:10px;width:100%;max-width:440px}
.armctl input{flex:1;accent-color:var(--muscle);direction:ltr}
.armctl span{font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.pill{flex:0 0 auto;font-weight:800;font-size:15px;color:#fff;background:var(--muscle);border-radius:999px;padding:1px 14px;transition:background .2s}
.pill.relax{background:var(--blue)}
.state{font-weight:800;fill:var(--muscle);paint-order:stroke;stroke:#fff;stroke-width:5px;font-family:var(--f-ui)}
.state.relax{fill:var(--blue)}
.tlabel{font-family:var(--f-ui);font-weight:800;font-size:15px;fill:#8A6100;paint-order:stroke;stroke:#fff;stroke-width:5px}
.ring{animation:ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.counter{font-weight:800;color:var(--blue);font-size:14px}

/* vocab cards */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:480px}
.vc{perspective:700px;border:0;background:none;padding:0;height:clamp(54px,14vh,84px)}
.vc{display:block;width:100%}
.vc .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.vc.flip .in{transform:rotateY(180deg)}
.vc .f,.vc .b{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:800;padding:4px 8px;text-align:center;line-height:1.3}
.vc .f{background:#fff;border:2px solid #D9E3EC;color:var(--ink);font-size:clamp(14px,1.7vw,18px);font-family:var(--f-book)}
.vc .b{background:var(--muscle);color:#fff;transform:rotateY(180deg);font-family:Georgia,serif;direction:ltr;font-size:clamp(14px,1.7vw,19px)}
.vc.seen .f{border-color:var(--ok)}

/* shapes & sort */
.items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px}
.zones{display:grid;gap:8px;width:100%}
.zones.z3{grid-template-columns:repeat(3,minmax(0,1fr))}
.zones.z2{grid-template-columns:repeat(2,minmax(0,1fr))}
.zones .zone{padding:6px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:clamp(84px,24vh,130px)}
.zh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--blue)}
.zh svg{width:28px;height:28px}
.zone .chip{font-size:12px;padding:3px 8px}
.chip svg.ms{height:18px;width:auto}

/* heart */
.heartrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,22px);width:100%;flex:1 1 auto;min-height:0}
.hcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:center;min-width:0}
.beat{height:clamp(100px,40vh,200px);aspect-ratio:246/274;animation:beat 1s ease-in-out infinite}
.beat img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.ecg{width:clamp(110px,18vw,180px);height:30px}
.ecg path{stroke:var(--muscle);stroke-width:2.5;fill:none;stroke-dasharray:60 340;animation:ecg 1s linear infinite}
.fib{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.fib img{height:clamp(66px,26vh,140px);border-radius:10px;border:2px solid #9CCB86}
.fib figcaption{font-size:12px;color:var(--ink-soft);font-weight:600}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hbtns .btn{display:flex;align-items:center;gap:6px}
.hbtns svg{width:22px;height:22px}
.minifore{transform-origin:9px 15px;transition:transform .35s ease}
.flex .minifore{transform:rotate(-70deg)}

/* spots */
.kwrap{position:relative;flex:1 1 0;min-height:0;aspect-ratio:574/475;max-width:100%}
.kwrap img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;border-radius:12px}
.spot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;background:var(--blue);box-shadow:0 0 0 0 rgba(29,111,184,.6);animation:pulse 1.6s infinite;padding:0}
.spot.seen{background:var(--ok);animation:none}
.tip{position:absolute;transform:translate(-50%,-115%);background:#26221D;color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;pointer-events:none;z-index:4}
.found{font-size:13px;font-weight:700;color:var(--ink-soft)}

/* cover & end */
.cover .sheet{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cv{display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.cv .subj{font-weight:700;color:var(--ink-soft);font-size:14px;margin:0}
.cv h1{margin:0;font-weight:800;font-size:clamp(24px,4.4vw,46px);line-height:1.15;color:var(--muscle);text-wrap:balance}
.cv .les{margin:0;font-family:var(--f-book);font-size:clamp(15px,2vw,20px);color:var(--blue);font-weight:700}
.cv .pp{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--magenta);font-weight:700}
.cv label{font-size:13px;font-weight:700;color:var(--ink-soft)}
.cv input{font-family:var(--f-ui);font-size:16px;padding:6px 12px;border-radius:12px;border:2px solid #D9E3EC;width:100%;max-width:280px;background:#fff;color:var(--ink)}
.cv .btn{align-self:flex-start;font-size:17px;padding:8px 26px}
.cert{width:100%;max-width:440px;border:3px double var(--gold);border-radius:18px;background:#FFFBEF;padding:12px 16px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.cert h3{margin:0;color:#8A6100;font-size:clamp(17px,2.4vw,24px)}
.cert .nm{font-size:clamp(22px,3.4vw,34px);font-weight:800;color:var(--muscle);line-height:1.2}
.cert p{margin:0;font-size:14px;color:var(--ink-soft)}
.bigstars{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.bigstars svg{width:20px;height:20px}


/* figure */
.figbox{position:relative;height:100%;max-width:100%;aspect-ratio:1/1;min-height:0}
.figbox svg{width:100%;height:100%;display:block;overflow:visible}
.fig .mus{transition:opacity .6s ease}
.fig.nomus .mus{opacity:0}
.fig .dash line{stroke:#D8D1C2;stroke-width:2.5;stroke-linecap:round}
.fig.moving .dash{animation:dash .36s linear infinite}
.fig.showten .ten{fill:#F5C534;stroke:#A87700;animation:tglow .7s ease-in-out infinite alternate}
.fig.showten path.ten[fill="none"]{fill:none;stroke:#F5C534}
@keyframes dash{to{transform:translateX(-60px)}}
@keyframes tglow{from{opacity:1}to{opacity:.55}}
.merged .figbox{height:100%;flex:0 1 auto}
.merged .badge{flex:0 0 auto;white-space:nowrap}
.page.wide .sheet{grid-template-columns:minmax(0,36fr) minmax(0,64fr)}
.skel .figbox{justify-self:center}
.cmdwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;height:100%;min-height:0}
.cmdwrap .figbox{justify-self:center}
.cmds{display:flex;flex-direction:column;gap:7px;align-items:stretch}
.cmds .btn{font-size:15px;padding:5px 16px}
.cmds .btn.on{filter:brightness(1.15)}
.cmdt{margin:0;font-weight:800;color:var(--ink-soft);font-size:14px}
/* shapes */
.items.big{gap:10px}
.mcard{flex-direction:column;gap:2px;padding:5px 10px 4px;font-size:13px}
.mcard .msv{height:clamp(34px,11vh,64px);width:auto}
.zone .mcard{padding:2px 6px;font-size:11px}
.zone .mcard .msv{height:clamp(16px,5vh,26px)}
.szone .zil{height:clamp(50px,17vh,96px);width:auto}
.zil .ghost,.zil .ghost *{fill:rgba(169,195,218,.25);stroke:#A9C3DA;stroke-width:1.5;stroke-dasharray:3 2;transition:fill .5s}
.zone.filled .zil .ghost,.zone.filled .zil .ghost *{fill:#D9443A;stroke:#7A1714;stroke-dasharray:none}
.zone.filled .zil .gl{opacity:.9;transition:opacity .5s}
.zone.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
/* answer slot */
.ans{min-height:40px;display:flex;align-items:center;justify-content:center;padding:4px;border-radius:12px}
.ans .ph{font-size:13px;font-weight:700;color:#7E9DB8}
.ans .slot-in{width:100%}
.ans .slot-in:empty{display:none}
.chip.opt{cursor:grab;width:100%;box-shadow:0 3px 0 #D2DCE5}
.chip.opt.placed{cursor:default}
.ghand{position:absolute;left:-14px;top:-6px;width:34px;height:34px;pointer-events:none;z-index:60;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.ghand svg{width:100%;height:100%}
.play{overflow:auto}


/* ---- lesson 2 additions & polish ---- */
.tab.m{background:var(--magenta)}
.tab.r{background:var(--red)}
.tab.y{background:#E5B12E;color:#3a2a00}
.tab.n{background:linear-gradient(to left,#2A8FE0,#1D6FB8)}
.fact{border:2px solid var(--magenta);border-radius:14px;padding:.4em .7em;background:#FFF6FA}
.sub.rd,.rd{color:var(--red)}
.bookfig.wide{float:none;display:block;width:100%;max-width:340px;margin:.2em auto .4em}
.txt-body.more{-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent);mask-image:linear-gradient(to bottom,#000 82%,transparent)}
.mascot.yay{animation:yay .7s ease}
.mascot.oops{animation:oops .5s ease}
@keyframes yay{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-8deg) scale(1.08)}60%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
@keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
/* label diagram */
.ldwrap{display:flex;gap:10px;align-items:stretch;width:100%;height:100%;min-height:0;direction:rtl}
.ldg{display:flex;direction:ltr;height:100%;min-height:0;flex:0 0 auto;align-items:stretch}
.lcol{position:relative;height:100%;flex:0 0 auto}
.lz{position:absolute;right:0;left:0;transform:translateY(-50%);min-height:24px;padding:1px 2px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.lz .slot-in{width:100%}
.lz .chip{font-size:11.5px;padding:1px 6px;justify-content:center;box-shadow:none;direction:rtl}
.lsvg{height:100%;min-height:0;flex:0 0 auto}
.lsvg svg{width:100%;height:100%;display:block}
.lchips{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:stretch;min-width:0}
.lchip{font-size:13px;padding:3px 10px;justify-content:center}
.bp{transition:filter .3s}
.bp.faint{opacity:.35}
.bp.hl{--bone:#FFD54A;--bone-line:#B07D00}
.bp.c1{--bone:#FFB39F;--bone-line:#C0392B}
.bp.c2{--bone:#9FD3FF;--bone-line:#1D6FB8}
.bp.c3{--bone:#C7B2FF;--bone-line:#6B47C2}
.bp.c4{--bone:#A8E6B5;--bone-line:#2C9A57}
/* hand */
.handrow{display:flex;align-items:center;gap:14px;height:100%;min-height:0;width:100%;justify-content:center}
.handrow.small{height:auto;flex:0 1 46%}
.handbox{height:100%;aspect-ratio:130/180;min-height:0;max-height:100%}
.handrow.small .handbox{height:clamp(70px,22vh,120px)}
.handsvg{width:100%;height:100%}
.hb{transition:transform .2s}
.hb.lit{--bone:#FFD54A;--bone-line:#B07D00}
.hn{font:700 7px var(--f-ui);fill:#7A4B00;text-anchor:middle;pointer-events:none}
.handctl{display:flex;flex-direction:column;align-items:center;gap:2px}
.hcount{font-size:clamp(34px,7vw,56px);color:var(--muscle);line-height:1}
.handctl span{font-weight:700;color:var(--ink-soft)}
/* hip joint */
.hipwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;height:100%;min-height:0}
.hipsvg{width:100%;height:100%;max-height:100%;touch-action:none;cursor:grab}
.hipsvg .cartH,.hipsvg .cartS{transition:opacity .4s}
.hipsvg.grind .fem circle{stroke:#D64040}
.ftxt{font:800 15px var(--f-ui);fill:#D64040;paint-order:stroke;stroke:#fff;stroke-width:4px}
.hl1{font:700 11px var(--f-ui);fill:#3E5C76;paint-order:stroke;stroke:#fff;stroke-width:3px}
.hipctl{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:150px}
.pill.good{background:var(--ok)}
.pill.warn{background:#E8833A}
/* joint types */
.jcol{align-items:center;text-align:center}
.jdemo svg{width:clamp(46px,14vh,74px);height:clamp(46px,14vh,74px)}
.jcol small{font-size:11px;color:var(--ink-soft);font-weight:600;line-height:1.3}
.spin{transform-origin:40px 40px;animation:jspin 3.2s linear infinite}
.hinge{transform-origin:40px 46px;animation:jhinge 1.6s ease-in-out infinite alternate}
@keyframes jspin{to{transform:rotate(360deg)}}
@keyframes jhinge{from{transform:rotate(0)}to{transform:rotate(-110deg)}}
/* animals / food / bag */
.zh .anim{width:clamp(40px,13vh,66px);height:auto;display:block}
.zone .zh:has(.anim){flex-direction:column;gap:0}
.fi{width:22px;height:22px;flex:0 0 auto}
.bagwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;height:100%;min-height:0}
.bagbox{height:100%;min-height:0;display:flex;justify-content:center}
.bagkid{height:100%;width:auto;max-width:100%}
.bagctl{display:flex;flex-direction:column;gap:5px;max-width:200px}
.seg{display:flex;border-radius:12px;overflow:hidden;border:2px solid var(--play-line);background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:5px 8px;font-weight:700;font-size:13px;color:var(--ink-soft)}
.seg button.on{background:var(--blue);color:#fff}
.kz .bagkid{height:clamp(72px,26vh,140px)}
.opts.four{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#dots{width:clamp(70px,14vw,150px);height:6px;border-radius:3px;background:#E4DCCB;overflow:hidden;display:block}
#dots i{display:block;height:100%;background:var(--blue);border-radius:3px;width:0;transition:width .4s}
.kz small{font-size:11px;color:var(--ink-soft);font-weight:700}
.okchip b{color:var(--ok);font-size:16px}
/* tree diagram */
.tree{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.troot{background:var(--blue);color:#fff;font-weight:800;border-radius:12px;padding:4px 18px}
.tlines{width:60%;height:22px}
.tz{min-height:54px;justify-content:center}
/* objectives */
.objbox{border-radius:14px;background:#fff;border:2px solid #E7EEF5;padding:.3em .6em;margin-bottom:.4em}
.obj{font-size:.92em}
.ob{display:inline-block;margin-inline-start:.4em;font:700 11px var(--f-ui);background:#EEF3F8;color:var(--ink-soft);border-radius:999px;padding:0 8px;vertical-align:middle}
.ob.ok{background:var(--ok-bg);color:var(--ok)}
.bookthumb{width:100%;max-width:150px;border-radius:10px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.lscore{display:flex;gap:8px;flex-wrap:wrap}
.lscore span{background:#fff;border:2px solid #E7EEF5;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700}
/* table of contents */
#toc{position:fixed;inset:0;z-index:150;background:rgba(15,35,48,.55);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.tocbox{background:var(--paper);border-radius:18px;width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.toch{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:2px solid #EEE7DA}
.toch b{font-size:17px}
.tocl{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.tocr{display:flex;align-items:center;gap:10px;border:2px solid #EEE7DA;background:#fff;border-radius:12px;padding:6px 10px;text-align:right;font-family:var(--f-ui)}
.tocr.cur{border-color:var(--blue)}
.tpg{width:32px;height:32px;border-radius:50%;border:2px solid var(--magenta);color:var(--magenta);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.tt{flex:1;font-weight:700;font-size:15px;display:flex;flex-direction:column;line-height:1.3}
.tt small{font-size:11px;color:var(--ink-soft);font-weight:600}
.ts{font-weight:800;color:#8A6100;font-size:13px;white-space:nowrap}

#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#26221D;color:#fff;padding:7px 16px;border-radius:12px;font-size:14px;z-index:100;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
#fx span{position:absolute;width:9px;height:9px;border-radius:2px}

/* portrait */
#rotate{position:fixed;inset:0;z-index:200;background:var(--desk);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px))}
#rotate svg{width:84px;height:84px;animation:turn 2.2s ease-in-out infinite}
#rotate p{margin:0;font-size:18px;font-weight:700;max-width:300px}
#rotate .btn{background:#fff;color:var(--desk);box-shadow:0 3px 0 #9fb5c1}
body.portrait #book{max-height:none}
body.portrait .sheet{display:flex;flex-direction:column;overflow:auto;padding:14px 26px 60px 14px}
body.portrait .txt-body{overflow:visible}
body.portrait .stage{min-height:340px;flex:0 0 auto}
body.portrait .cover .sheet{display:flex}
body.portrait #dots{display:none}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
@keyframes run{from{transform:translateY(0) rotate(0)}to{transform:translateY(-5px) rotate(-1.2deg)}}
@keyframes speed{from{transform:translateX(30%);opacity:0}30%{opacity:1}to{transform:translateX(-60%);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(.98)}36%{transform:scale(1.05)}50%{transform:scale(1)}}
@keyframes ecg{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,111,184,.55)}70%{box-shadow:0 0 0 12px rgba(29,111,184,0)}100%{box-shadow:0 0 0 0 rgba(29,111,184,0)}}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- science 4: plants theme ---- */
:root{--muscle:#2E8B3D;--muscle-2:#5DBB63;--desk:#1E3A2B;--desk-2:#2E5A3F}
.btn{box-shadow:0 3px 0 #1C5A26}.btn:active{box-shadow:0 1px 0 #1C5A26}
.btn.alt{box-shadow:0 3px 0 #12528C}
.btn:disabled{opacity:.6;cursor:default}
.badge{box-shadow:0 4px 0 #1C5A26}
.say{background:#E3F3E2;color:var(--muscle)}
.bubble{border-color:#CFE5C8}.bubble::before{border-inline-end-color:#CFE5C8}
.cv h1{color:var(--muscle)}
.bookfig.tall{float:left;width:30%;max-width:150px}
.bookfig.sq{max-width:250px}
.bp.hl{--bone:#FFD54A}
.lsvg .bp{transition:filter .3s}
.lsvg .bp.hl,.lsvg .bp.c1,.lsvg .bp.c2,.lsvg .bp.c3,.lsvg .bp.c4{filter:drop-shadow(0 0 3px #FFD54A) drop-shadow(0 0 2px #FFB300)}
/* scenes */
.tlwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;height:100%;min-height:0}
.scenebox{height:100%;min-height:0;display:flex;justify-content:center;align-items:center}
.scenebox svg,.scene{height:100%;max-height:100%;width:auto;max-width:100%;border-radius:14px;display:block}
.scene{box-shadow:0 2px 0 #D2DCE5}
.tlctl{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:170px}
.tlctl .pill{text-align:center;white-space:normal;line-height:1.35;padding:3px 12px}
.tog.on{filter:brightness(1.08);outline:3px solid #FFE7A6}
.btn.warm{background:#E8833A;box-shadow:0 3px 0 #A3521A}
.scene.wet .sp{filter:saturate(1.1)}
/* dishes */
.dish{width:100%;height:auto;display:block}
.dlab{font:800 10px var(--f-ui);fill:#3E5C76}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;flex:1 1 auto;min-height:0;align-items:center}
.duo>*{min-width:0}
.duo.small{flex:0 0 auto;max-width:250px;margin:0 auto}
.dishrow{gap:14px}
.dchip{width:clamp(110px,22vw,170px);padding:2px}
.zone .dchip{width:clamp(90px,16vw,130px)}
.pico{width:56px;height:38px}
.zones .zh .pico{width:52px;height:34px}
/* beans */
.beanchip{padding:3px 6px}
.bico{width:clamp(38px,6vw,52px);height:auto;display:block}
.zone .beanchip .bico{width:30px}
.pickrow{gap:6px}
/* venn / sort tweaks */
.zones.venn .zone:nth-child(2){background:#FFF8E1;border-color:#E5B12E}
.vico{width:30px;height:30px}
.zones.fold .zone,.zones.board .zone{background:#FFFDF3}
.zones.z4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ord .zone{min-height:clamp(78px,22vh,120px)}
.ord .zh{flex-direction:column;gap:0;font-size:16px}
.stico{width:clamp(34px,9vh,54px);height:auto}
.arr{position:absolute;inset-inline-end:-12px;top:40%;color:var(--green);font-weight:800}
.ord .zone{position:relative}
.zcap{font-size:11px;font-weight:800;color:var(--ok)}
.pkchip{padding:2px}
.pkchip img{height:clamp(48px,14vh,74px);width:auto;display:block;border-radius:8px;mix-blend-mode:multiply}
.zone .pkchip img{height:clamp(40px,11vh,60px)}
/* cycle */
.cycle{position:relative;width:100%;max-width:440px;flex:1 1 auto;min-height:150px;max-height:260px}
.cyar{position:absolute;inset:0;width:100%;height:100%}
.cz{position:absolute;width:34%;min-height:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cz0{right:2%;top:4%}.cz1{left:33%;bottom:2%}.cz2{left:2%;top:4%}
.cico{height:clamp(30px,10vh,52px);width:auto}
.cz .chip{font-size:11px;padding:2px 6px}
/* apple */
.applerow{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;min-height:0}
.abox{height:100%;max-height:220px;aspect-ratio:160/130;cursor:pointer}
.applesvg{width:100%;height:100%}
.applesvg .hL,.applesvg .hR,.applesvg .core{transition:transform .6s ease}
.applesvg .hL,.applesvg .hR{opacity:0;transition:opacity .2s .35s,transform .6s .35s}
.applesvg.cut .hL{opacity:1;transform:translateX(-14px) rotate(-6deg)}
.applesvg.cut .hR{opacity:1;transform:translateX(14px) rotate(6deg)}
.applesvg .hR .flesh{transform:scaleX(1)}
.applesvg.cut .whole{opacity:0;transition:opacity .2s .35s}
.applesvg .knife{transform:translateY(-10px);opacity:.95;transition:transform .35s ease-in,opacity .3s .4s}
.applesvg.cut .knife{transform:translateY(90px);opacity:0}
.applesvg:not(.cut) .knife{animation:bob 1.6s ease-in-out infinite}
.seedsrow{flex-direction:column;min-height:0}
.aseed{width:16px;height:24px;display:block}
.soilz{height:100%;max-height:230px;aspect-ratio:240/300;padding:3px;display:flex;align-items:center;justify-content:center;position:relative}
.soilz .scenebox{position:absolute;inset:3px}
.soilz .ph{position:relative;z-index:2;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 6px}
/* pea */
.peasvg,.treesvg{height:100%;width:auto;max-width:100%}
.peasvg .vine{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.0001);transition:transform 1.1s ease}
.peasvg .lv,.peasvg .pf,.peasvg .pp{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;transition:transform .6s var(--d,0ms) ease,opacity .6s var(--d,0ms)}
.peasvg[data-st="0"] .seedl{opacity:1}.peasvg .seedl{opacity:0;transition:opacity .5s}
.peasvg:not([data-st="0"]) .vine{transform:scaleY(1)}
.peasvg:not([data-st="0"]) .lv{transform:scale(1);opacity:1}
.peasvg[data-st="2"] .pf{transform:scale(1);opacity:1}
.peasvg[data-st="3"] .pp,.peasvg[data-st="4"] .pp{transform:scale(1);opacity:1}
.peasvg[data-st="4"] .pod{fill:#C8E6A0}
.peasvg[data-st="4"] .pea{opacity:0;transition:opacity .4s}
.peasvg .fall{opacity:0}
.peasvg[data-st="4"] .fall{animation:fall 1.2s var(--d) ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(var(--fx),90px)}}
.peasvg .ns{opacity:0;transition:opacity .6s}
.peasvg[data-st="4"] .ns{opacity:1;transition-delay:1.3s}
.peasvg .roots{opacity:0}.peasvg:not([data-st="0"]) .roots{opacity:1}
/* tree */
.treesvg .tree{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.05);opacity:0;transition:transform 1.4s ease,opacity .5s}
.treesvg:not([data-st="0"]) .tree{transform:scale(1);opacity:1}
.treesvg .sap{transition:opacity .5s}.treesvg:not([data-st="0"]) .sap{opacity:0}
.treesvg .bl{cursor:pointer}
.treesvg .bl .bf,.treesvg .bl .ap{transform-box:fill-box;transform-origin:center;transition:transform .5s,opacity .5s}
.treesvg .bl .ap{transform:scale(0);opacity:0}
.treesvg .bl .bf{transform:scale(0)}
.treesvg[data-st="2"] .bl .bf{transform:scale(1);animation:bloom 1.8s ease-in-out infinite}
.treesvg .bl.fr .bf{transform:scale(0)!important;animation:none}
.treesvg .bl.fr .ap{transform:scale(1);opacity:1}
@keyframes bloom{50%{transform:scale(1.12)}}
/* seeds activity */
.seedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:440px}
.scard{border:2px solid #D9E3EC;background:#fff;border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:700;font-size:13px;color:var(--ink);box-shadow:0 3px 0 #D2DCE5}
.scard svg{width:clamp(36px,11vh,60px);height:clamp(36px,11vh,60px)}
.scard.op{border-color:var(--ok);background:var(--ok-bg)}
.sico{width:24px;height:24px;flex:0 0 auto}
/* spread */
.spread{width:100%;height:auto;max-height:100%;flex:1 1 auto;min-height:0}
.spbtns .btn{font-size:13px;padding:4px 12px}
.spbtns .btn.on{border:0;box-shadow:0 0 0 2px var(--ok)}
.spread .ws,.spread .wsd,.spread .antg,.spread .birdg,.spread .bseed,.spread .gust{opacity:0}
.spread .wsd{transform:translate(180px,158px)}
.go-wind .ws{animation:wfly 2.4s calc(var(--k)*.15s) ease-in-out forwards}
.go-wind .gust{animation:gst 2s ease forwards}
@keyframes wfly{0%{opacity:1;transform:translate(0,0)}60%{opacity:1;transform:translate(calc(110px + var(--k)*20px),calc(-30px + var(--k)*8px))}100%{opacity:1;transform:translate(calc(150px + var(--k)*22px),calc(70px + var(--k)*4px))}}
@keyframes gst{0%{opacity:0;transform:translateX(-20px)}30%{opacity:.9}100%{opacity:0;transform:translateX(60px)}}
.go-water .wsd{animation:wsd 2.6s ease-in-out forwards}
@keyframes wsd{0%{opacity:1;transform:translate(190px,156px)}50%{transform:translate(250px,160px) rotate(30deg)}100%{opacity:1;transform:translate(310px,152px) rotate(60deg)}}
.go-ant .antg{animation:antw 2.6s linear forwards}
@keyframes antw{0%{opacity:1;transform:translate(52px,140px)}100%{opacity:1;transform:translate(160px,140px)}}
.go-bird .birdg{animation:bfly 2.6s ease-in-out forwards}
.go-bird .wing{animation:flap .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}
@keyframes flap{to{transform:scaleY(-.6)}}
@keyframes bfly{0%{opacity:1;transform:translate(10px,30px)}100%{opacity:1;transform:translate(300px,20px)}}
.go-bird .bseed{animation:bdrop 2.6s ease-in forwards}
@keyframes bdrop{0%,40%{opacity:0;transform:translate(150px,30px)}45%{opacity:1;transform:translate(150px,30px)}100%{opacity:1;transform:translate(170px,140px)}}
/* fills */
.fills{display:flex;flex-direction:column;gap:6px;width:100%;font-size:clamp(13px,calc(.6vw + 1.5vh),15px);font-weight:600;line-height:1.9}
.fl{display:flex;gap:6px;align-items:flex-start}
.fl .nb{margin-top:.35em}
.blank{display:inline-flex;min-width:96px;min-height:28px;vertical-align:middle;padding:1px 4px;border-radius:10px;align-items:center;justify-content:center}
.blank .chip{font-size:12px;padding:1px 8px}
.wbank{gap:6px}
.wbank .chip{font-size:13px;padding:3px 10px}
/* poster */
.picchip{padding:3px}
.picchip svg{height:clamp(40px,12vh,64px);width:auto;display:block}
.poster .zone{min-height:clamp(88px,26vh,140px)}
.zone .picchip svg{height:clamp(34px,10vh,56px)}
.hfruit.warnf{animation:shake .5s 2}
/* cover */
.cvplant{height:100%;max-height:300px;width:auto}
.zh svg.cico{height:clamp(34px,11vh,54px);width:auto}
.zh svg.stico{width:auto;height:clamp(40px,12vh,64px)}
.zh svg.pico{width:52px;height:34px}
.zh svg.vico{width:30px;height:30px}
.cz{min-height:clamp(70px,20vh,100px)}
.lchips{min-width:104px}
.soilz .ph{font-size:12px;white-space:normal;text-align:center;line-height:1.3}
.soilz{min-width:110px}
.cz{width:32%}
.zone .picchip svg{height:clamp(46px,15vh,76px)}
.zh svg.cico{height:clamp(40px,13vh,62px)}

</style>

/* ---------- sound fx ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,d,type,g,when){const c=ac();if(!c||S.muted)return;const t=c.currentTime+(when||0);const o=c.createOscillator(),v=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g||.18,t+.015);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.05);}
const SFX={
 ok(){tone(660,.18,"triangle",.2);tone(990,.25,"triangle",.18,.1);},
 no(){tone(200,.22,"sawtooth",.08);tone(150,.25,"sawtooth",.07,.08);try{react("oops");navigator.vibrate&&navigator.vibrate(70);}catch(_){}},
 star(){[784,988,1175,1568].forEach((f,i)=>tone(f,.22,"sine",.14,i*.07));},
 tap(){tone(520,.07,"sine",.1);},
 flip(){const c=ac();if(!c||S.muted)return;const n=c.sampleRate*.22,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2)*Math.sin(Math.PI*i/n);}const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=.7;const g=c.createGain();g.gain.value=.5;s.connect(f).connect(g).connect(c.destination);s.start();}
};

function burst(el){const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,fx=$("#fx");const cols=["#F2AE16","#D63C35","#1D6FB8","#3A9A3A","#D2357F"];
 for(let i=0;i<16;i++){const p=document.createElement("span");p.style.left=x+"px";p.style.top=y+"px";p.style.background=cols[i%5];fx.appendChild(p);const a=Math.random()*Math.PI*2,d=50+Math.random()*70;
  const an=p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+30}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:800+Math.random()*300,easing:"cubic-bezier(.2,.7,.4,1)"});an.onfinish=()=>p.remove();}}

/* ---------- text rendering ---------- */
function words(t){const toks=t.split(/\s+/).filter(Boolean);let out=[],grp=null,buf=[];
 const flush=()=>{if(!buf.length)return;out.push(grp?`<span class="${grp}">${buf.join(" ")}</span>`:buf.join(" "));buf=[];};
 for(let w of toks){let c="";if(w[0]==="^"){c="mk";w=w.slice(1);}else if(w[0]==="~"){c="rd";w=w.slice(1);}else if(w[0]==="%"){c="bl";w=w.slice(1);}
  if(c!==grp){flush();grp=c;} buf.push(`<span class="w">${w}</span>`);}
 flush();return out.join(" ");}
const esc=s=>s.replace(/"/g,"&quot;");
function block(b){
 switch(b.k){
  case "h": return `<h2 class="bh" data-s="${esc(b.s)}">${words(b.t)}</h2>`;
  case "p": return `<p class="bp${b.cls?" "+b.cls:""}" data-s="${esc(b.s)}">${words(b.t)}</p>`;
  case "cap": return `<p class="cap" data-s="${esc(b.s)}"><span class="tri"></span><span>${words(b.t)}</span></p>`;
  case "li": return `<p class="li${b.cls?" "+b.cls:""}"${b.o?` data-o="${b.o}"`:""} data-s="${esc(b.s)}">${words(b.t)}</p>`;
  case "num": return `<p class="num" data-s="${esc(b.s)}"><span class="nb">${b.n}</span><span>${words(b.t)}</span></p>`;
  case "tab": return `<div class="tab ${b.c||"g"}">${b.t}</div>`;
  case "fig": return `<img class="bookfig${b.cls?" "+b.cls:""}" src="${IMG[b.img]}" alt="${b.alt}">`;
  case "html": return b.h;
 }return "";}

/* ---------- speech ---------- */
const TTS=(()=>{
 const ok="speechSynthesis" in window;let voice=null,enVoice=null,token=0,timer=null,onStop=null,queue=[];
 function pick(){if(!ok)return;const vs=speechSynthesis.getVoices();const ar=vs.filter(v=>/^ar/i.test(v.lang));
  voice=ar.find(v=>/google/i.test(v.name))||ar.find(v=>/(naayf|hoda|maged|majed|laila|tarik|zariyah|hamed|salma|shakir|fatima)/i.test(v.name))||ar[0]||null;
  const en=vs.filter(v=>/^en/i.test(v.lang));enVoice=en.find(v=>/google us|samantha|aria|jenny/i.test(v.name))||en[0]||null;}
 if(ok){pick();speechSynthesis.onvoiceschanged=pick;}
 function clearHL(){$$(".w.on").forEach(e=>e.classList.remove("on"));$$(".reading").forEach(e=>e.classList.remove("reading"));}
 function stop(){token++;queue=[];clearTimeout(timer);if(ok)speechSynthesis.cancel();clearHL();const f=onStop;onStop=null;f&&f();}
 const dur=w=>Math.max(300,w.replace(/[ً-ْٰ]/g,"").length*105)/0.85;
 function next(my){if(my!==token)return;clearHL();const it=queue.shift();if(!it){const f=onStop;onStop=null;f&&f();return;}
  const u=new SpeechSynthesisUtterance(it.s);
  if(it.en){u.lang="en-US";if(enVoice)u.voice=enVoice;u.rate=.8;}else{u.lang=voice?voice.lang:"ar-SA";if(voice)u.voice=voice;u.rate=.85;}
  const els=it.el?[...it.el.querySelectorAll(".w")]:[];if(it.el)it.el.classList.add("reading");
  const sp=it.s.split(/\s+/).filter(Boolean),offs=[];let p=0;for(const w of sp){const i=it.s.indexOf(w,p);offs.push(i);p=i+w.length;}
  const map=i=>els.length===sp.length?i:Math.min(els.length-1,Math.floor(i*els.length/sp.length));
  let last=-1,gotB=false;const hl=i=>{if(!els.length)return;const d=map(i);if(d===last)return;if(last>=0&&els[last])els[last].classList.remove("on");if(els[d]){els[d].classList.add("on");if(it.scroll)els[d].scrollIntoView({block:"nearest",behavior:"smooth"});}last=d;};
  u.onboundary=e=>{if(my!==token)return;if(e.name&&e.name!=="word")return;gotB=true;clearTimeout(timer);let k=0;while(k+1<offs.length&&offs[k+1]<=e.charIndex)k++;hl(k);};
  u.onstart=()=>{if(my!==token)return;hl(0);let k=0;const step=()=>{if(gotB||my!==token)return;k++;if(k<sp.length){hl(k);timer=setTimeout(step,dur(sp[k]));}};timer=setTimeout(step,dur(sp[0])+300);};
  u.onend=()=>{clearTimeout(timer);if(my!==token)return;setTimeout(()=>next(my),280);};
  u.onerror=e=>{clearTimeout(timer);if(my!==token)return;if(e.error==="interrupted"||e.error==="canceled")return;toast("تعذّر تشغيل الصوت. تأكد من وجود صوت عربي في إعدادات الهاتف.");stop();};
  speechSynthesis.speak(u);}
 function play(items,done){stop();if(!ok){toast("هذا المتصفح لا يدعم القراءة الصوتية.");done&&done();return;}
  if(!voice&&!items[0].en&&!play.warned){play.warned=1;toast("لا يوجد صوت عربي في هذا الجهاز، سيُستعمل الصوت المتاح.");}
  queue=items.slice();onStop=done;const my=token;next(my);}
 return {play,stop};
})();

/* ---------- drag & drop / tap-to-place ---------- */
const HANDI='<svg viewBox="0 0 40 40"><path d="M15 4c2 0 3 1.5 3 3.5V18l1-.4c1.8-.6 3.5.4 3.8 2l.2.8 1-.3c1.8-.4 3.3.7 3.5 2.3l.1.6.8-.2c1.7-.3 3.1.9 3.1 2.6V32c0 3-2.4 5-5.4 5h-6.4c-2 0-3.8-1-4.8-2.7l-5.4-8.6c-.9-1.4-.4-3.2 1-3.9 1.2-.6 2.6-.3 3.4.7l1.3 1.6V7.5C11.9 5.5 13 4 15 4z" fill="#fff" stroke="#26221D" stroke-width="2" stroke-linejoin="round"/></svg>';
function dragHint(root,from,to){if(!from||!to)return;const h=document.createElement("div");h.className="ghand";h.innerHTML=HANDI;root.appendChild(h);
 const rr=root.getBoundingClientRect(),a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
 const ax=a.left+a.width/2-rr.left,ay=a.top+a.height/2-rr.top,bx=b.left+b.width/2-rr.left,by=b.top+b.height/2-rr.top;
 const an=h.animate([{transform:`translate(${ax}px,${ay}px) scale(1)`,opacity:0},{transform:`translate(${ax}px,${ay}px) scale(.9)`,opacity:1,offset:.15},{transform:`translate(${bx}px,${by}px) scale(.9)`,opacity:1,offset:.7},{transform:`translate(${bx}px,${by}px) scale(1)`,opacity:0}],{duration:1700,iterations:2,easing:"ease-in-out"});
 const kill=()=>{an.cancel();h.remove();root.removeEventListener("pointerdown",kill,true);};an.onfinish=kill;root.addEventListener("pointerdown",kill,true);}
function matchGame(root,{check,onGood,onBad,onDone,tapPlace,hint}){
 let sel=null;const items=$$(".chip:not(.placed)",root),zones=$$(".zone",root);let left=items.length;
 const zoneAt=(x,y,ch)=>{for(const el of document.elementsFromPoint(x,y)){if(ch.contains(el))continue;const z=el.closest&&el.closest(".zone");if(z&&root.contains(z))return z;}return null;};
 function place(ch,z){if(ch.classList.contains("placed"))return;
  if(check(ch.dataset.id,z.dataset.z)){ch.classList.remove("sel","wrong");ch.classList.add("placed");ch.style.transform="";($(".slot-in",z)||z).appendChild(ch);z.classList.add("filled");SFX.ok();onGood&&onGood(ch,z);left--;if(!left)onDone&&onDone();}
  else{ch.style.transform="";ch.classList.remove("sel");ch.classList.add("shake");setTimeout(()=>ch.classList.remove("shake"),420);z.classList.add("shake");setTimeout(()=>z.classList.remove("shake"),420);SFX.no();onBad&&onBad(ch,z);}
  sel=null;}
 items.forEach(ch=>{ch.tabIndex=0;let sx,sy,moved=false,down=false;
  ch.addEventListener("pointerdown",e=>{if(ch.classList.contains("placed"))return;down=true;moved=false;sx=e.clientX;sy=e.clientY;try{ch.setPointerCapture(e.pointerId);}catch(_){}});
  ch.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)>6){moved=true;ch.classList.add("dragging");}
   if(moved){ch.style.transform=`translate(${dx}px,${dy}px) scale(1.05) rotate(-2deg)`;const z=zoneAt(e.clientX,e.clientY,ch);zones.forEach(q=>q.classList.toggle("hot",q===z));}});
  const up=e=>{if(!down)return;down=false;zones.forEach(q=>q.classList.remove("hot"));
   if(moved){ch.classList.remove("dragging");const zone=zoneAt(e.clientX,e.clientY,ch);if(zone)place(ch,zone);else{ch.style.transform="";}}
   else if(tapPlace&&zones.length===1){place(ch,zones[0]);}
   else{SFX.tap();if(sel===ch){ch.classList.remove("sel");sel=null;}else{sel&&sel.classList.remove("sel");sel=ch;ch.classList.add("sel");}}};
  ch.addEventListener("pointerup",up);ch.addEventListener("pointercancel",()=>{down=false;ch.classList.remove("dragging");ch.style.transform="";});
  ch.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(tapPlace&&zones.length===1){place(ch,zones[0]);return;}sel&&sel.classList.remove("sel");sel=ch;ch.classList.add("sel");}});});
 zones.forEach(z=>{z.tabIndex=0;z.addEventListener("click",()=>{if(sel)place(sel,z);});z.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&sel){e.preventDefault();place(sel,z);}});});
 if(hint&&items.length&&zones.length)setTimeout(()=>{if(root.isConnected&&!$(".placed",root)){const it=items.find(x=>!x.classList.contains("placed"));const z=typeof hint==="function"?hint(it):zones[0];dragHint(root,it,z);}},900);
}

/* ---------- multiple choice (drag the answer into the slot) ---------- */
function mcq(root,q,api,onRight){
 const L=["أ","ب","ج","د"];
 root.innerHTML=`<div class="mcq"><p class="qq"><span class="qlabel">${q.label}.</span> ${q.q}</p>
  <div class="zone ans" data-z="ans"><span class="ph">اسحب الإجابة الصحيحة إلى هنا</span><div class="slot-in"></div></div>
  <div class="opts${q.opts.length>3?" four":""}">${q.opts.map((o,i)=>`<div class="chip opt" data-id="${i}"><b>${L[i]}</b><span>${o.t}</span></div>`).join("")}</div>
  <div class="fb" hidden></div></div>`;
 const fb=$(".fb",root);
 const win=(ch,silent)=>{ch.classList.add("right");$(".ph",root).hidden=true;$(".opts",root).hidden=true;fb.className="fb ok";fb.textContent=q.explain;fb.hidden=false;
  if(!silent){award(q.key,ch);api.coach(q.praise||"أحسنت! إجابة صحيحة.");}onRight&&onRight(silent);};
 if(S.stars.includes(q.key)){const i=q.opts.findIndex(o=>o.ok),ch=$(`.opt[data-id="${i}"]`,root);ch.classList.add("placed");$(".ans .slot-in",root).appendChild(ch);win(ch,true);return;}
 matchGame(root,{tapPlace:true,hint:true,check:id=>!!q.opts[+id].ok,
  onGood:ch=>win(ch,false),

{ id:"p61c", page:61, lesson:2, wide:true, stars:["week","q61"],

{ id:"p61d", page:61, lesson:2, wide:true, stars:["salt"],

  ],
  coach:"تجربة جديدة: الإناءان في غرفة الصف هذه المرة. اضغط «مرّ أسبوع» وقارن.",

     explain:"صحيح! ماء الحنفية مناسب للإنبات، أما الماء المالح فيضرّ البذور. لذلك نسقي النباتات بماء عذب."},api,()=>api.done());};
   play.innerHTML=`<div class="duo"><div class="d1">${dishSVG(0,"ماء الحنفية",{water:1})}</div><div class="d2">${dishSVG(0,"ماء + ملح الطعام",{water:1,salt:1})}</div></div><button class="btn" data-a="go">⏩ مرّ أسبوع</button>`;

   {k:"p",t:"نباتٌ مُعمّرٌ جذورُهُ وتديةٌ حمراءُ اللونِ ينمو بشكلِ شجيراتٍ كثيرةِ الفروعِ، وأوراقُهُ بسيطةٌ، وأزهارُهُ بيضاءُ اللونِ ذاتُ رائحةٍ عطريةٍ قويةٍ. تكثرُ زراعةُ نباتِ الحِنَّاءِ في منطقةِ الفاوِ في محافظةِ البصرةِ جنوبي العراقِ، يُستخرَجُ من أوراقِ نباتِ الحِنَّاءِ مسحوقُ الحِنَّاءِ الذي يُستخدَمُ في صبغِ الشعرِ، وتُستخدَمُ أزهارُهُ في صناعةِ العطورِ، كما يُستخدَمُ كدواءٍ للأمراضِ الجلديةِ.",

   {k:"li",t:"أختارُ نباتين أحدُهما لازهريّ والآخر زهريّ.",s:"أَخْتَارُ نَبَاتَيْنِ أَحَدُهُمَا لَازَهْرِيٌّ وَالآخَرُ زَهْرِيٌّ."},
   {k:"li",t:"أرسمُ دورةَ حياةٍ لكلٍّ منهما على لوحةٍ مقسمةٍ على نصفين بحيث يكونُ في نصفِ اللوحةِ الأول دورةُ حياة نباتٍ لازهري وفي النصفِ الثاني دورةُ حياةِ نباتٍ زهري .",s:"أَرْسُمُ دَوْرَةَ حَيَاةٍ لِكُلٍّ مِنْهُمَا عَلَى لَوْحَةٍ مُقَسَّمَةٍ عَلَى نِصْفَيْنِ بِحَيْثُ يَكُونُ فِي نِصْفِ اللَّوْحَةِ الأَوَّلِ دَوْرَةُ حَيَاةِ نَبَاتٍ لَازَهْرِيٍّ وَفِي النِّصْفِ الثَّانِي دَوْرَةُ حَيَاةِ نَبَاتٍ زَهْرِيٍّ."},
   {k:"li",t:"أحدِّدُ أوجهَ التشابهِ والاختلافِ بينَ مراحلِ دورةِ حياةِ النباتين.",s:"أُحَدِّدُ أَوْجُهَ التَّشَابُهِ وَالاخْتِلَافِ بَيْنَ مَرَاحِلِ دَوْرَةِ حَيَاةِ النَّبَاتَيْنِ."},
   {k:"li",t:"~ألخِّصُ. ما توصلتُ إليه وأناقشُ زملائي في الصف في ذلك.",s:"أُلَخِّصُ. مَا تَوَصَّلْتُ إِلَيْهِ وَأُنَاقِشُ زُمَلَائِي فِي الصَّفِّ فِي ذَلِكَ."},
   {k:"tab",t:"أختارُ الإجابةَ الصحيحةَ",c:"g"},
   {k:"p",t:"تُعدُّ عمليةُ إنتاجِ البذورِ في النباتاتِ أحدَ أشكالِ: أ. التغذية ب. التلقيحِ ج. الإنباتِ د. التكاثرِ",s:"تُعَدُّ عَمَلِيَّةُ إِنْتَاجِ البُذُورِ فِي النَّبَاتَاتِ أَحَدَ أَشْكَالِ: أ التَّغْذِيَةِ، ب التَّلْقِيحِ، ج الإِنْبَاتِ، د التَّكَاثُرِ."}
  ],
  coach:"لوحتك مقسومة على نصفين: الحزاز (لازهري) والبازلاء (زهري). ضع كل مرحلة في نصفها، والمشترك في الوسط.",
  stage(play,api){
   const fin=()=>{mcq(qhold(play),{key:"c11",label:"أختار الإجابة الصحيحة",q:"تُعدّ عملية إنتاج البذور في النباتات أحد أشكال:",opts:[{t:"التغذية",fb:"التغذية صنع الغذاء، والبذور ليست للتغذية هنا."},{t:"التلقيح",fb:"ليس هذا ما درسناه. البذرة تعطي نباتاً جديداً… فهذا اسمه؟"},{t:"الإنبات",fb:"الإنبات يحدث بعد تكوين البذرة، عندما تنمو."},{t:"التكاثر",ok:true}],explain:"صحيح! البذور طريقة النبات الزهري في التكاثر: من بذرة واحدة ينمو نبات جديد."},api,()=>api.done());};
   if(S.stars.includes("board")){fin();return;}

   $(".zones",play).classList.add("venn");
  }}

const SCREENS=[
{ id:"cover", page:null, cover:true },
...S60,...S63,...S65,...S66,...S67,
{ id:"end", page:68, end:true }
];
function quizSeq(play,api,qs){let i=0;
 const show=()=>{play.innerHTML=`<div class="qnav">${qs.map((q,k)=>`<span class="${k===i?"cur":""}">${/^[٠-٩]/.test(q.label)?"":AR(k+1)+" "}${q.label}</span>`).join("")}</div><div class="qhold" style="width:100%;display:flex;justify-content:center"></div><button class="btn alt" data-a="nx" hidden>السؤال التالي</button>`;
  const nx=$("[data-a=nx]",play);
  mcq($(".qhold",play),qs[i],api,()=>{if(i<qs.length-1){nx.hidden=false;}else api.done();});
  nx.addEventListener("click",()=>{i++;show();});};
 show();}

TOTAL=SCREENS.reduce((n,s)=>n+(s.stars?s.stars.length:0),0);
const OBJ={o1:["spread","dissect"],o2:["germ","pea2","cyc63","apple2"],o3:["week","salt","pea1"]};
/* ---------- page building ---------- */
const book=$("#book");let curEl=null,curP=null,busy=false;
function pageShell(scr){const el=document.createElement("section");el.className="page"+(scr.cover?" cover":"")+(scr.wide?" wide":"");return el;}
function buildPage(i){
 const scr=SCREENS[i],el=pageShell(scr);
 if(scr.cover){
  el.innerHTML=`<div class="sheet"><div class="cv">
    <p class="subj">كتاب العلوم · الصف الرابع الابتدائي</p>
    <h1>دوراتُ حياةِ<br>النباتاتِ الزهريةِ</h1>
    <p class="les">الدرس الثاني · ومراجعة الفصل</p>
    <span class="pp">الصفحات ٦٠ – ٦٨</span>
    <label for="nm">ما اسمك؟</label>
    <input id="nm" maxlength="24" placeholder="اكتب اسمك هنا" value="${(S.name||"").replace(/"/g,"")}" autocomplete="off">
    <button class="btn" id="startBtn">افتح الكتاب</button></div>
   <div class="stage"><div class="coach">${MASCOT}<div class="bubble"><span class="bt">${words("مرحباً! أنا بذرون، بذرة باقلاء صغيرة. سأرافقك في صفحات كتابك لنعرف كيف تصبح البذرة نباتاً، ثم يعطي النبات بذوراً جديدة.")}</span></div><button class="say" aria-label="استمع">${SPK}</button></div>
   <div class="play"><div class="scenebox cvbox"></div></div></div></div><div class="shade"></div>`;
  const nm=$("#nm",el);nm.addEventListener("input",()=>{S.name=nm.value.trim();save();});
  $("#startBtn",el).addEventListener("click",()=>{ac();go(1);});
  wireCoach(el);let stop=null,alive=true;
  return {el,setup(){const G=growBox($(".cvbox",el),{id:"cv"});const loop=()=>{if(!alive)return;stop=tweenVal(0,2.4,6000,v=>G.set(Math.min(1,v),c01((v-1.2)/.8)),()=>{setTimeout(loop,900);});};loop();},cleanup(){alive=false;stop&&stop();}};
 }
 if(scr.end){
  const n=S.stars.length;const ls=L=>{const ks=SCREENS.filter(s=>s.lesson===L).flatMap(s=>s.stars||[]);return [ks.filter(k=>S.stars.includes(k)).length,ks.length];};const l2=ls(2),l3=ls(9);
  el.innerHTML=`<div class="sheet"><div class="cv"><p class="subj">انتهت الصفحات ٦٠ – ٦٨</p><h1>أحسنت!</h1><p class="les">تعلّمت عوامل إنبات البذور، ومكوّنات البذرة، ومراحل دورة حياة البازلاء وشجرة التفاح، وطرائق انتشار البذور، ونباتات نادرة في بلادك.</p>
    <div class="lscore"><span>الدرس الثاني: <b>${AR(l2[0])} / ${AR(l2[1])}</b></span><span>مراجعة الفصل: <b>${AR(l3[0])} / ${AR(l3[1])}</b></span></div>
    <button class="btn alt" id="again">أعد الدرس من البداية</button></div>
   <div class="stage" style="justify-content:center;align-items:center"><div class="cert"><h3>شهادة بطل النباتات</h3><div class="nm">${S.name?S.name.replace(/</g,""):"البطل"}</div>
    <div class="bigstars">${Array.from({length:TOTAL},(_,k)=>k<n?STAR:STAR0).join("")}</div><p>جمعت ${AR(n)} نجمة من ${AR(TOTAL)}</p><p>${n===TOTAL?"علامة كاملة! أنت بطل حقيقي.":"ارجع إلى الصفحات وأكمل النجوم الناقصة."}</p></div></div></div><div class="shade"></div>`;
  $("#again",el).addEventListener("click",()=>{S.stars=[];save();renderStars();go(1,-1);});
  return {el,setup(){if(n>=TOTAL)setTimeout(()=>burst($(".cert",el)),400);}};
 }
 el.innerHTML=`<div class="sheet"><div class="txt"><div class="txt-head"><span class="booktag"><i></i>صفحة ${AR(scr.page)} · ${scr.lesson===9?"مراجعة الفصل":"دورات حياة النباتات"}</span><button class="readbtn">${SPK}<span>اقرأ لي</span></button></div><div class="txt-body">${scr.blocks.map(block).join("")}</div></div>
  <div class="stage"><div class="coach">${MASCOT}<div class="bubble"><span class="bt">${words(scr.coach)}</span></div><button class="say" aria-label="استمع لشرح بذرون">${SPK}</button></div><div class="play"></div></div></div><div class="shade"></div>`;
 $$(".obj",el).forEach(li=>{const k=OBJ[li.dataset.o];const ok=k&&k.every(x=>S.stars.includes(x));li.insertAdjacentHTML("beforeend",k?`<span class="ob${ok?" ok":""}">${ok?"✓ أتقنتُه":"سنتعلّمه"}</span>`:`<span class="ob">صفحة ٧٠</span>`);});
 const tb=$(".txt-body",el);const fade=()=>tb.classList.toggle("more",tb.scrollHeight-tb.scrollTop-tb.clientHeight>6);tb.addEventListener("scroll",fade,{passive:true});requestAnimationFrame(()=>requestAnimationFrame(fade));
 const rb=$(".readbtn",el);
 rb.addEventListener("click",()=>{if(rb.classList.contains("on")){TTS.stop();return;}
  const items=$$("[data-s]",el).filter(x=>x.closest(".txt-body")).map(x=>({s:x.dataset.s,el:x,scroll:true}));
  rb.classList.add("on");rb.innerHTML=STOP+"<span>إيقاف</span>";
  TTS.play(items,()=>{rb.classList.remove("on");rb.innerHTML=SPK+"<span>اقرأ لي</span>";});});
 wireCoach(el);
 const api={
  coach(t){const b=$(".bubble",el);$(".bt",b).innerHTML=words(t);b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");},
  done(){if(i===S.cur)$("#next").classList.add("nudge");},
  leave(f){leaves.push(f);}
 };const leaves=[];
 return {el,setup(){scr.stage($(".play",el),api);},cleanup(){leaves.forEach(f=>{try{f();}catch(_){}});}};
}
function wireCoach(el){const say=$(".say",el);if(!say)return;say.addEventListener("click",()=>{const b=$(".bubble .bt",el);TTS.play([{s:b.textContent,el:b}]);});}

function go(n,dirOverride){
 if(busy||n<0||n>=SCREENS.length||n===S.cur&&curEl)return;
 TTS.stop();const dir=dirOverride||(n>S.cur?1:-1);const old=curEl,oldP=curP;const P=buildPage(n);curP=P;
 const drop=()=>{oldP&&oldP.cleanup&&oldP.cleanup();old&&old.remove();};
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 S.cur=n;save();updateNav();
 if(!old){book.insertBefore(P.el,$("#nav"));curEl=P.el;P.setup();return;}
 busy=true;SFX.flip();
 const T="perspective(2400px) rotateY(";
 if(dir>0){book.insertBefore(P.el,old);P.setup();
  const a=old.animate(reduce?[{opacity:1},{opacity:0}]:[{transform:T+"0deg)"},{transform:T+"172deg)"}],{duration:reduce?150:760,easing:"cubic-bezier(.4,.05,.3,1)",fill:"forwards"});
  if(!reduce){const shh=$(".sheet",old);shh&&shh.animate([{opacity:1,offset:0},{opacity:1,offset:.38},{opacity:0,offset:.46},{opacity:0,offset:1}],{duration:760,easing:"cubic-bezier(.4,.05,.3,1)",fill:"forwards"});}
  const sh=$(".shade",old);sh&&sh.animate([{opacity:0},{opacity:.9}],{duration:500,fill:"forwards"});
  a.onfinish=()=>{drop();curEl=P.el;busy=false;};}
 else{book.insertBefore(P.el,$("#nav"));P.setup();
  const a=P.el.animate(reduce?[{opacity:0},{opacity:1}]:[{transform:T+"172deg)"},{transform:T+"0deg)"}],{duration:reduce?150:760,easing:"cubic-bezier(.4,.05,.3,1)"});
  if(!reduce){const shh=$(".sheet",P.el);shh&&shh.animate([{opacity:0,offset:0},{opacity:0,offset:.54},{opacity:1,offset:.62},{opacity:1,offset:1}],{duration:760,easing:"cubic-bezier(.4,.05,.3,1)"});}
  const sh=$(".shade",P.el);sh&&sh.animate([{opacity:.9},{opacity:0}],{duration:720});
  a.onfinish=()=>{drop();curEl=P.el;busy=false;};}
}
function updateNav(){
 const scr=SCREENS[S.cur];$("#prev").disabled=S.cur===0;$("#next").disabled=S.cur===SCREENS.length-1;$("#next").classList.remove("nudge");
 $("#pgnum").textContent=scr.page?AR(scr.page):"٦٠";$("#pgnum").style.visibility=scr.cover?"hidden":"visible";
 $("#dots").innerHTML=`<i style="width:${Math.round(S.cur/(SCREENS.length-1)*100)}%"></i>`;
}

/* ---------- table of contents ---------- */
const PGT={60:"دورات حياة النباتات الزهرية",61:"أستكشف: إنبات البذور",62:"كيف تنمو النباتات من البذور؟",63:"دورة حياة البازلاء",64:"دورة حياة شجرة التفاح",65:"مراجعة الدرس",66:"قراءة علمية: نباتات نادرة",67:"مراجعة الفصل",68:"مراجعة الفصل (٢)"};
function openTOC(){const pages=[...new Set(SCREENS.filter(s=>s.page&&!s.end).map(s=>s.page))];
 $(".tocl").innerHTML=pages.map(pg=>{const ss=SCREENS.filter(s=>s.page===pg&&!s.end),ks=ss.flatMap(s=>s.stars||[]),got=ks.filter(k=>S.stars.includes(k)).length,first=SCREENS.indexOf(ss[0]);
  return `<button class="tocr${S.cur>=first&&S.cur<first+ss.length?" cur":""}" data-i="${first}"><span class="tpg">${AR(pg)}</span><span class="tt">${PGT[pg]||""}<small>${ss[0].lesson===9?"مراجعة الفصل":"الدرس الثاني"}</small></span><span class="ts">${got===ks.length&&ks.length?"✓ ":""}${AR(got)} / ${AR(ks.length)}</span></button>`;}).join("");
 $$(".tocr").forEach(b=>b.addEventListener("click",()=>{$("#toc").hidden=true;const i=+b.dataset.i;if(i!==S.cur)go(i);}));$("#toc").hidden=false;}
$("#tocb").addEventListener("click",()=>{SFX.tap();openTOC();});$("#tocx").addEventListener("click",()=>$("#toc").hidden=true);$("#toc").addEventListener("click",e=>{if(e.target.id==="toc")$("#toc").hidden=true;});
/* ---------- swipe (on text area & page edges) ---------- */
let sw=null;
book.addEventListener("pointerdown",e=>{if(e.target.closest(".stage,button,input,.chip"))return;sw={x:e.clientX,y:e.clientY,t:Date.now()};});
book.addEventListener("pointerup",e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,dt=Date.now()-sw.t;sw=null;
 const sel=window.getSelection&&String(window.getSelection());if(sel)return;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&dt<700){if(dx>0)go(S.cur+1);else go(S.cur-1);}});

/* ---------- controls ---------- */
$("#next").addEventListener("click",()=>{ac();go(S.cur+1);});
$("#prev").addEventListener("click",()=>{ac();go(S.cur-1);});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")go(S.cur+1);if(e.key==="ArrowRight")go(S.cur-1);});
const mute=$("#mute");const setMute=()=>{mute.innerHTML=S.muted?SND_OFF:SND_ON;mute.setAttribute("aria-pressed",String(!S.muted));};
mute.addEventListener("click",()=>{S.muted=!S.muted;save();setMute();});
$("#fs").addEventListener("click",async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();try{await screen.orientation.lock("landscape");}catch(_){} }else await document.exitFullscreen();}catch(_){toast("ملء الشاشة غير متاح هنا.");}});

/* ---------- orientation ---------- */
let portraitOk=false;const mq=matchMedia("(orientation: portrait) and (max-width: 820px)");
function orient(){const p=mq.matches;$("#rotate").hidden=!p||portraitOk;document.body.classList.toggle("portrait",p&&portraitOk);}
mq.addEventListener?mq.addEventListener("change",orient):mq.addListener(orient);
$("#portraitOk").addEventListener("click",()=>{portraitOk=true;orient();});

/* ---------- boot ---------- */
function start(data){
 load();if(data&&typeof data.cur==="number"){Object.assign(S,data);}
 if(S.cur<0||S.cur>=SCREENS.length)S.cur=0;
 setMute();renderStars();orient();
 const c=S.cur;S.cur=-1;go(c);
 window.claude?.hot?.snapshot?.(()=>({cur:S.cur,stars:S.stars,name:S.name,muted:S.muted}));
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
